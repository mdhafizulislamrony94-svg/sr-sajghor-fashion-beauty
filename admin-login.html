<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SR Sajghor - Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111, #444);
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #777;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #111;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <h1>🌸 SR সাজঘর</h1>
            <p>Admin Login</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>👤 Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Username লিখুন"
                    required
                >
            </div>

            <div class="form-group">
                <label>🔑 Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password লিখুন"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>

            <div id="errorMessage" class="error">
                ❌ Username অথবা Password ভুল!
            </div>

        </form>

    </div>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {

        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("errorMessage");

        try {

            const response = await fetch("/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {

                alert("✅ Login সফল হয়েছে!");

                window.location.href = "admin-panel.html";

            } else {

                errorMessage.textContent = "❌ " + data.message;
                errorMessage.style.display = "block";

            }

        } catch (error) {

            errorMessage.textContent = "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।";
            errorMessage.style.display = "block";

        }

    });
</script>


</body>
</html>
