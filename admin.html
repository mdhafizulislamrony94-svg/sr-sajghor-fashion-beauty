<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SR Sajghor - Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 30px;
        }

        .orders-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .orders-box h2 {
            margin-bottom: 20px;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .order h3 {
            margin-bottom: 10px;
        }

        .order p {
            margin: 7px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
/* Status Design */

.status-select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin: 5px 5px 5px 0;
    font-size: 14px;
}

.update-status-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #111;
    color: white;
    cursor: pointer;
}

.update-status-btn:hover {
    opacity: 0.8;
}

/* Refresh Button */

.refresh-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 20px;
}

.refresh-btn:hover {
    opacity: 0.8;
}
.delete-order-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #c62828;
    color: white;
    cursor: pointer;
    margin-left: 5px;
}

.delete-order-btn:hover {
    opacity: 0.8;
}

    </style>
</head>

<body>

    <div class="header">
        <h1>🌸 SR সাজঘর</h1>
        <p>Admin Order Panel</p>

        <button
            onclick="adminLogout()"
            style="
                 margin-top: 12px;
                 padding: 8px 18px;
                 border: none;
                 border-radius: 7px;
                 background: #c62828;
                 color: white;
                 cursor: pointer;
                 font-size: 14px;
          "
         >
             🚪 Logout
        </button>
    </div>

    <div class="container">

        <div class="dashboard">

            <div class="card">
                <h3>📦 মোট অর্ডার</h3>
                <strong id="totalOrders">0</strong>
            </div>

            <div class="card">
                <h3>⏳ Pending</h3>
                <strong id="pendingOrders">0</strong>
            </div>

            <div class="card">
                <h3>💰 মোট বিক্রি</h3>
                <strong>৳ <span id="totalSales">0</span></strong>
            </div>

        </div>

        <div class="orders-box">

            <h2>📋 সকল অর্ডার</h2>

            <button class="refresh-btn" onclick="loadOrders()">
    🔄 অর্ডার Refresh
</button>

            <div id="ordersList">
                <div class="loading">
                    ⏳ অর্ডার লোড হচ্ছে...
                </div>
            </div>

        </div>

    </div>
<script>

// ================= ADMIN AUTH CHECK =================

async function checkAdminLogin() {

    try {

        const response = await fetch("/api/admin/check");

        if (!response.ok) {
            window.location.href = "/admin-login.html";
            return;
        }

        const data = await response.json();

        if (!data.success) {
            window.location.href = "/admin-login.html";
        }

    } catch (error) {

        console.error("Login check error:", error);

        window.location.href = "/admin-login.html";
    }
}

checkAdminLogin();

// ================= ADMIN LOGOUT =================

async function adminLogout() {

    try {

        const response = await fetch(
            "/api/admin/logout",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (data.success) {
            window.location.href = "/admin-login.html";
        } else {
            alert("❌ Logout করা যায়নি");
        }

    } catch (error) {

        console.error(error);

        alert("❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।");
    }
}

async function loadOrders() {

    const ordersList = document.getElementById("ordersList");

    try {

        const response = await fetch("/api/orders");
        const data = await response.json();

        if (!data.success) {
            throw new Error("অর্ডার পাওয়া যায়নি");
        }

        const orders = data.orders;

        // Dashboard হিসাব
        document.getElementById("totalOrders").innerText =
            orders.length;

        const pending = orders.filter(
            order => order.status === "pending"
        ).length;

        document.getElementById("pendingOrders").innerText =
            pending;

        const totalSales = orders.reduce(
            (sum, order) => sum + Number(order.total),
            0
        );

        document.getElementById("totalSales").innerText =
            totalSales;

        // কোনো অর্ডার না থাকলে
        if (orders.length === 0) {

            ordersList.innerHTML = `
                <div class="loading">
                    📭 এখনো কোনো অর্ডার নেই।
                </div>
            `;

            return;
        }

        // পুরোনো অর্ডার পরিষ্কার
        ordersList.innerHTML = "";

        // অর্ডার দেখানো
        orders.forEach(order => {

            const products = order.products
                .map(product =>
                    `${product.name} — ৳ ${product.price}`
                )
                .join("<br>");

            const orderDiv = document.createElement("div");

            orderDiv.className = "order";

            orderDiv.innerHTML = `
                <h3>📦 Order ID: ${order.orderId}</h3>

                <p>👤 <strong>নাম:</strong> ${order.name}</p>

                <p>📱 <strong>ফোন:</strong> ${order.phone}</p>

                <p>🏠 <strong>ঠিকানা:</strong> ${order.address}</p>

                <p>🛍️ <strong>পণ্য:</strong><br>
                    ${products}
                </p>

                <p>💰 <strong>মোট:</strong>
                    ৳ ${order.total}
                </p>

<p>🔄 <strong>Status:</strong></p>

<select class="status-select" id="status-${order.orderId}">
    <option value="pending" ${order.status === "pending" ? "selected" : ""}>
        ⏳ Pending
    </option>

    <option value="confirmed" ${order.status === "confirmed" ? "selected" : ""}>
        ✅ Confirmed
    </option>

    <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>
        📦 Delivered
    </option>

    <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>
        ❌ Cancelled
    </option>
</select>

<button
    class="delete-order-btn"
    onclick="deleteOrder('${order.orderId}')">
    🗑️ Order Delete
</button>

<button
    class="update-status-btn"
    onclick="updateOrderStatus('${order.orderId}')">
    🔄 Status Update
</button>

                <p>🕐 <strong>সময়:</strong>
                    ${new Date(order.createdAt).toLocaleString("bn-BD")}
                </p>
            `;

            ordersList.appendChild(orderDiv);

        });

    } catch (error) {

        console.error(error);

        ordersList.innerHTML = `
            <div class="loading">
                ❌ অর্ডার লোড করা যাচ্ছে না।
            </div>
        `;
    }
}


// Admin Panel চালু হলে অর্ডার লোড হবে

async function updateOrderStatus(orderId) {

    const select =
        document.getElementById("status-" + orderId);

    const status = select.value;

    try {

        const response = await fetch(
            "/api/orders/" + orderId + "/status",
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        alert("✅ Order Status আপডেট হয়েছে!");

        loadOrders();

    } catch (error) {

        console.error(error);

        alert("❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।");
    }
}
async function deleteOrder(orderId) {

    const confirmDelete = confirm(
        "⚠️ আপনি কি এই অর্ডারটি Delete করতে চান?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            "/api/orders/" + orderId,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        alert("🗑️ অর্ডার সফলভাবে Delete হয়েছে!");

        loadOrders();

    } catch (error) {

        console.error(error);

        alert("❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।");
    }
}

loadOrders();

</script>


</body>
</html>
